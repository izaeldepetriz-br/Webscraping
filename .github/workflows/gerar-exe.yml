# Gera o programa para Windows (.exe) numa máquina Windows do GitHub, a cada envio para a main.
# O resultado fica em Actions > (a execução) > Artifacts > videoscraper-windows.
# Ao criar uma tag v1.0, v1.1... o .zip também vai para a página de Releases.
name: Gerar o .exe (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gerar o programa
        run: python -m PyInstaller videoscraper.spec --noconfirm
      - name: Autoteste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList "--verificar" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "autoteste falhou ($($p.ExitCode))"; exit 1 }
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist\videoscraper -DestinationPath videoscraper-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: videoscraper-windows
          path: videoscraper-windows.zip
      - name: Publicar na página de Releases (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: videoscraper-windows.zip
