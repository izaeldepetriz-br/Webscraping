# Gera o programa para Windows (.exe) numa máquina Windows do GitHub, a cada envio para a main.
# O resultado fica em Actions > (a execução) > Artifacts > videoscraper-windows.
# Ao criar uma tag v1.0, v1.1... o .zip também vai para a página de Releases. Sem tag: Actions >
# "Gerar o .exe (Windows)" > Run workflow > preencha "versao" (ex.: v1.1).
name: Gerar o .exe (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar em Releases como esta versão (ex.: v1.1). Vazio = só gera o .exe"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gravar a versão no programa (aviso de versão nova)
        shell: pwsh
        run: |
          $v = "${{ inputs.versao }}"
          if (-not $v -and "${{ github.ref }}".StartsWith("refs/tags/v")) { $v = "${{ github.ref_name }}" }
          if ($v) { Set-Content -Path videoscraper\versao_build.txt -Value $v -NoNewline }
      - name: Gerar o programa
        run: python -m PyInstaller videoscraper.spec --noconfirm
      - name: Autoteste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList "--verificar" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "autoteste falhou ($($p.ExitCode))"; exit 1 }
      - name: Autoteste do navegador no .exe (baixa o Chromium e abre uma página)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList "--verificar-navegador" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "o modo navegador não abriu ($($p.ExitCode))"; exit 1 }
          if (-not $env:PLAYWRIGHT_BROWSERS_PATH -and -not (Test-Path "$env:LOCALAPPDATA\ms-playwright")) { Write-Error "Chromium fora da pasta do usuário"; exit 1 }
          Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -ErrorAction SilentlyContinue | Select-Object Name
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist\videoscraper -DestinationPath videoscraper-windows.zip
      - name: Autoteste da atualização (o programa fecha e os arquivos são trocados)
        shell: pwsh
        run: |
          $inst = Join-Path $env:RUNNER_TEMP 'instalado'
          Copy-Item dist\videoscraper $inst -Recurse
          $alvo = (Get-ChildItem $inst -Recurse -Filter catalogo_filmes.json | Select-Object -First 1).FullName
          Remove-Item $alvo                                   # "versão velha": falta um arquivo
          $zip = (Resolve-Path videoscraper-windows.zip).Path
          $p = Start-Process -FilePath (Join-Path $inst 'videoscraper.exe') -ArgumentList '--testar-atualizacao', "`"$zip`"" -PassThru
          $p.WaitForExit()
          "o programa fechou com o código $($p.ExitCode)"
          Get-Content (Join-Path $env:TEMP 'videoscraper-teste-atualizacao.txt') -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 90 -and -not (Test-Path $alvo); $i++) { Start-Sleep 1 }
          Get-Content (Join-Path $env:TEMP 'videoscraper-atualizacao.log') -ErrorAction SilentlyContinue
          if (-not (Test-Path $alvo)) {
            Get-Content (Join-Path $env:TEMP 'videoscraper-atualizar.ps1') -ErrorAction SilentlyContinue
            Write-Error "a atualização não trocou os arquivos"; exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: videoscraper-windows
          path: videoscraper-windows.zip
      - name: Publicar na página de Releases (tags v* ou "versao" preenchida)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Versão ${{ inputs.versao || github.ref_name }}
          body_path: .github/notas-da-versao.md
          files: videoscraper-windows.zip
