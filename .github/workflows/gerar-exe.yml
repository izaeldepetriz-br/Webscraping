# Gera o programa para Windows (.exe) numa máquina Windows do GitHub, a cada envio para a main.
# O resultado fica em Actions > (a execução) > Artifacts > videoscraper-windows.
# Ao criar uma tag v1.0, v1.1... o .zip também vai para a página de Releases. Sem tag: Actions >
# "Gerar o .exe (Windows)" > Run workflow > preencha "versao" (ex.: v1.1).
name: Gerar o .exe (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar em Releases como esta versão (ex.: v1.1). Vazio = só gera o .exe"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gravar a versão no programa (aviso de versão nova)
        shell: pwsh
        run: |
          $v = "${{ inputs.versao }}"
          if (-not $v -and "${{ github.ref }}".StartsWith("refs/tags/v")) { $v = "${{ github.ref_name }}" }
          if ($v) { Set-Content -Path videoscraper\versao_build.txt -Value $v -NoNewline }
      - name: Gerar o programa
        run: python -m PyInstaller videoscraper.spec --noconfirm
      - name: Autoteste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList "--verificar" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "autoteste falhou ($($p.ExitCode))"; exit 1 }
          $m = Start-Process -FilePath dist\videoscraper\Maestro.exe -ArgumentList "--verificar" -Wait -PassThru
          if ($m.ExitCode -ne 0) { Write-Error "o Maestro.exe não abriu ($($m.ExitCode))"; exit 1 }
      - name: Autoteste dos comandos de robô (RPA) no .exe (sem janela, com código de saída)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\Maestro.exe -ArgumentList "--conferir-canais" -Wait -PassThru
          $json = Join-Path $env:USERPROFILE '.videoscraper\rpa\ultimo.json'
          Get-Content $json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 2) { Write-Error "esperava o código 2 (lista de canais vazia); veio $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path $json)) { Write-Error "o resumo ultimo.json não foi gravado"; exit 1 }
      - name: Autoteste do navegador no .exe (baixa o Chromium e abre uma página)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList "--verificar-navegador" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "o modo navegador não abriu ($($p.ExitCode))"; exit 1 }
          if (-not $env:PLAYWRIGHT_BROWSERS_PATH -and -not (Test-Path "$env:LOCALAPPDATA\ms-playwright")) { Write-Error "Chromium fora da pasta do usuário"; exit 1 }
          Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -ErrorAction SilentlyContinue | Select-Object Name
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist\videoscraper -DestinationPath videoscraper-windows.zip
      - name: Autoteste da atualização (o programa fecha e os arquivos são trocados)
        shell: pwsh
        run: |
          $inst = Join-Path $env:RUNNER_TEMP 'instalado'
          Copy-Item dist\videoscraper $inst -Recurse
          $alvo = (Get-ChildItem $inst -Recurse -Filter catalogo_filmes.json | Select-Object -First 1).FullName
          Remove-Item $alvo                                   # "versão velha": falta um arquivo
          $zip = (Resolve-Path videoscraper-windows.zip).Path
          $p = Start-Process -FilePath (Join-Path $inst 'videoscraper.exe') -ArgumentList '--testar-atualizacao', "`"$zip`"" -PassThru
          $p.WaitForExit()
          "o programa fechou com o código $($p.ExitCode)"
          Get-Content (Join-Path $env:TEMP 'videoscraper-teste-atualizacao.txt') -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 90 -and -not (Test-Path $alvo); $i++) { Start-Sleep 1 }
          Get-Content (Join-Path $env:TEMP 'videoscraper-atualizacao.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:TEMP 'videoscraper-atualizar-saida.txt') -ErrorAction SilentlyContinue
          if (-not (Test-Path $alvo)) {
            Get-Content (Join-Path $env:TEMP 'videoscraper-atualizar.ps1') -ErrorAction SilentlyContinue
            Write-Error "a atualização não trocou os arquivos"; exit 1
          }
      - name: Autoteste do lugar fixo e dos atalhos (Área de Trabalho e Menu Iniciar)
        shell: pwsh
        run: |
          $velho = Join-Path ([Environment]::GetFolderPath('Desktop')) 'videoscraper.lnk'
          Set-Content -Path $velho -Value 'atalho antigo'           # o de antes do nome novo: tem que sumir
          $p = Start-Process -FilePath dist\videoscraper\videoscraper.exe -ArgumentList '--testar-instalacao' -PassThru
          $p.WaitForExit()
          Get-Content (Join-Path $env:TEMP 'videoscraper-teste-instalacao.txt') -ErrorAction SilentlyContinue
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\videoscraper\Maestro.exe'
          $mesa = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Maestro.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Maestro.lnk'
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe) -or -not (Test-Path $mesa) -or -not (Test-Path $menu)) {
            Write-Error "instalação no lugar fixo falhou (exe: $(Test-Path $exe), mesa: $(Test-Path $mesa), menu: $(Test-Path $menu))"; exit 1
          }
          $alvo = (New-Object -ComObject WScript.Shell).CreateShortcut($mesa).TargetPath
          "atalho -> $alvo"
          if ($alvo -ne $exe) { Write-Error "o atalho não aponta para o lugar fixo"; exit 1 }
          if (Test-Path $velho) { Write-Error "o atalho antigo 'videoscraper' não foi tirado"; exit 1 }
          $compat = Join-Path $env:LOCALAPPDATA 'Programs\videoscraper\videoscraper.exe'
          if (-not (Test-Path $compat)) { Write-Error "faltou o videoscraper.exe (as versões antigas se atualizam por ele)"; exit 1 }
          if (-not ((Get-Item -Force $compat).Attributes -match 'Hidden')) { Write-Error "o videoscraper.exe não ficou escondido"; exit 1 }
          $v = Start-Process -FilePath $exe -ArgumentList '--verificar' -PassThru -Wait
          if ($v.ExitCode -ne 0) { Write-Error "o programa do lugar fixo não abriu"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: videoscraper-windows
          path: videoscraper-windows.zip
      - name: Publicar na página de Releases (tags v* ou "versao" preenchida)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Versão ${{ inputs.versao || github.ref_name }}
          body_path: .github/notas-da-versao.md
          files: videoscraper-windows.zip
