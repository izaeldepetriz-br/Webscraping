# (o PyAV 19 tirou uma opção que o faster-whisper usa: "av<19", como no Maestro)
# Teste do F5-TTS em português (ajuste firstpixel/F5-TTS-pt-br, arquitetura F5TTS_Base): as mesmas 8 falas de emoção
# e as mesmas 2 vozes do "Teste de emoções" (as referências vêm daquela execução). Cada emoção roda numa máquina (no
# processador o F5 leva minutos por frase); no fim os áudios vão juntos para o ramo "audios-f5-<execução>".
name: Teste F5-TTS

on:
  push:
    branches: [teste-xtts]
    paths:
      - .github/scripts/f5_teste.py
      - .github/workflows/teste-f5.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        emocao: [raiva, odio, choro, medo, alegria, tristeza, sussurro, grito]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: xtts
          path: refs
          run-id: 39105076401
          github-token: ${{ github.token }}
      - name: F5-TTS
        run: |
          set -o pipefail
          { pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu \
            && pip install f5-tts faster-whisper "av<19" \
            && python .github/scripts/f5_teste.py saida refs/saida ${{ matrix.emocao }}; } 2>&1 | tee registro_f5.txt
      - name: Mostrar o erro
        if: failure()
        run: echo "::error title=f5 ${{ matrix.emocao }}::$(grep -v -E 'Downloading|━|Collecting|Requirement already|Using cached|Successfully|Installing collected' registro_f5.txt | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - if: always()
        run: mkdir -p saida && cp registro_f5.txt saida/registro_${{ matrix.emocao }}.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f5-${{ matrix.emocao }}
          path: saida

  juntar:
    needs: f5
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f5-*
          path: resultados/saida
          merge-multiple: true
      - name: Guardar os áudios num ramo
        run: |
          cd resultados
          python3 -c "import json,pathlib; p=pathlib.Path('saida'); json.dump([x for a in sorted(p.glob('f5_*.json')) for x in json.loads(a.read_text())], open(p/'f5.json','w'), ensure_ascii=False, indent=1)"
          git init -q -b audios-f5-${{ github.run_id }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Teste F5-TTS (execução ${{ github.run_id }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD
