# Teste de verdade da aba 🎮 Jogos num Windows, como no PC de quem usa o Maestro: baixa o xdelta3 oficial, cria e
# aplica um .xdelta e um .ppf em ISOs de mentira; o Redump e a busca de patches na comunidade (sites de verdade); e a
# dublagem de um jogo de mentira com o Piper, montando a ISO em português; e instalar a tradução no PC e no Switch com
# os caminhos do Windows. Roda quando a aba muda, toda segunda-feira (se um site mudar a página, o teste avisa) e pelo
# "Run workflow".
name: Patch de jogos no Windows

on:
  push:
    paths:
      - jellyfin_tools/patch_jogo.py
      - jellyfin_tools/redump.py
      - jellyfin_tools/comunidade.py
      - jellyfin_tools/iso_jogo.py
      - jellyfin_tools/audio_jogo.py
      - jellyfin_tools/dublar_jogo.py
      - jellyfin_tools/consoles.py
      - jellyfin_tools/instalar_traducao.py
      - .github/scripts/testar_patch_jogo.py
      - .github/scripts/testar_jogos_ao_vivo.py
      - .github/workflows/testar-patch-jogo.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8          # os avisos com acento (o Windows imprimiria em cp1252)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Criar e aplicar patches
        shell: bash
        run: |
          set -o pipefail
          { python -m pip install --upgrade pip && pip install -r requirements.txt pytest \
            && python .github/scripts/testar_patch_jogo.py "$RUNNER_TEMP/patch"; } 2>&1 | tee registro.txt
      - name: Redump e Procurar na comunidade (os sites de verdade)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/testar_jogos_ao_vivo.py sites "$RUNNER_TEMP/sites" 2>&1 | tee -a registro.txt
      - name: Dublar um jogo de mentira no PC (Piper) e montar a ISO em português
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/testar_jogos_ao_vivo.py dublar "$RUNNER_TEMP/dublar" 2>&1 | tee -a registro.txt
      - name: Instalar a tradução no PC e no Switch (caminhos do Windows) e desfazer
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/testar_jogos_ao_vivo.py instalar "$RUNNER_TEMP/instalar" 2>&1 | tee -a registro.txt
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          echo "::error title=patch de jogos::$(grep -v -E 'Downloading|━|Collecting|Requirement already|Using cached|Successfully|Installing collected' registro.txt | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
