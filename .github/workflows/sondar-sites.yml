# Temporário: baixa páginas dos sites de patches (PO.B.R.E, Romhacking.net, fórum, itch.io) e do Redump para
# o Maestro aprender o formato de cada uma; as páginas vão para o ramo "sondagem-sites-<execução>".
name: Sondar sites

on:
  push:
    branches: [sondar-sites]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar as páginas
        run: |
          mkdir -p paginas && cd paginas
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          baixar() { curl -sSL -A "$UA" -m 60 -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> ../resumo.txt 2>>../erros.txt || echo "$1 FALHOU $2" >> ../resumo.txt; }
          baixar pobre_main.js "https://romhackers.org/assets/js/main.js"
          baixar pobre_robots.txt "https://romhackers.org/robots.txt"
          baixar pobre_console.html "https://romhackers.org/traducoes/console"
          baixar pobre_ps2.html "https://romhackers.org/traducoes/console/playstation-2/"
          baixar pobre_ps2b.html "https://romhackers.org/traducoes/console/playstation-2"
          baixar pobre_psx.html "https://romhackers.org/traducoes/console/playstation/"
          baixar itch_robots.txt "https://itch.io/robots.txt"
          baixar itch_busca3.html "https://itch.io/search?q=ps2+traducao+pt-br"
          baixar forum_robots.txt "https://www.romhacking.net.br/robots.txt"
          baixar forum_busca.html "https://www.romhacking.net.br/index.php?action=search2;search=god+of+war;searchtype=1;subject_only=1"
          baixar redump_robots.txt "http://redump.org/robots.txt"
          baixar rhn_robots.txt "https://www.romhacking.net/robots.txt"
          python3 - <<'PY' >> ../resumo.txt
          import re, pathlib, subprocess
          t = pathlib.Path("pobre_ps2.html").read_text(errors="replace") if pathlib.Path("pobre_ps2.html").exists() else ""
          links = re.findall(r'href="(https://romhackers.org/traducoes/console/playstation-2/[^"]+/)"', t)
          print("links ps2:", len(links), links[:5])
          for i, url in enumerate(links[:2]):
              subprocess.run(["curl", "-sSL", "-A", "Mozilla/5.0", "-m", "60", "-o", f"pobre_detalhe{i}.html", url])
          m = re.findall(r'href="([^"]*(?:pagina|page|\?p=)[^"]*)"', t)
          print("paginas:", m[:10])
          PY
          ls -la
          cd .. && cat resumo.txt && cat erros.txt || true
          true || python3 - <<'PY'
          import zipfile, io, re, pathlib
          z = pathlib.Path("paginas/redump_ps2.zip")
          try:
              with zipfile.ZipFile(z) as f:
                  nome = f.namelist()[0]
                  dados = f.read(nome).decode("utf-8", "replace")
              print("DAT", nome, len(dados))
              pathlib.Path("paginas/redump_ps2_inicio.dat").write_text(dados[:20000])
              achado = re.search(r'<game name="Burnout 3[^"]*".*?</game>', dados, re.S)
              pathlib.Path("paginas/redump_burnout.txt").write_text(achado.group(0) if achado else "não achou")
          except Exception as erro:
              print("DAT falhou", erro)
          z.unlink(missing_ok=True)
          PY
      - name: Guardar num ramo
        if: always()
        run: |
          mkdir -p r && cp -r paginas resumo.txt erros.txt r/ 2>/dev/null || true
          cd r
          git init -q -b sondagem-sites-${{ github.run_id }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sondagem dos sites (execução ${{ github.run_id }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD
