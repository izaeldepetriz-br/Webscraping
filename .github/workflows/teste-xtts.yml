# Teste de áudio do XTTS-v2 (só neste ramo, não vai para a main): baixa o modelo, gera falas em português com as
# vozes prontas e guarda os .wav + relatorio.json em "Artifacts" da execução. Roda no processador (sem placa de vídeo).
name: Teste XTTS

on:
  push:
    branches: [teste-xtts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xtts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o PyTorch (processador) e o XTTS
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install coqui-tts faster-whisper
          pip list | grep -i -E "^(torch|torchaudio|coqui-tts|transformers|faster-whisper) "
      - name: Gerar as falas
        run: python .github/scripts/teste_xtts.py saida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audios-xtts
          path: saida/
