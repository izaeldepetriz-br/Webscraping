# Roda os testes automáticos a cada envio para a main e em cada pedido de mudança (pull request).
# Passou: aparece um ✓ verde ao lado do commit. Falhou: um ✕ vermelho; clique nele (ou em Actions >
# "Testes") para ver QUAL teste quebrou e por quê, antes de gerar o .exe e publicar uma versão.
# O pytest-github-actions-annotate-failures põe o nome e a linha de cada teste que falhou no resumo da execução.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    # versão fixa do Ubuntu: o "ubuntu-latest" passa a ser o Ubuntu 26 a partir de 19/10/2026, e os testes da janela
    # dependem dos pacotes do sistema (Tk, xvfb, ffmpeg); a troca de versão fica para quando der para testar com calma
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
      # ffmpeg do sistema: o do pacote imageio-ffmpeg no Linux é "estático" e fecha sozinho (Segmentation fault)
      # ao ler um streaming (.m3u8) pela rede. O programa usa o do sistema quando existe.
      - name: Instalar a tela virtual (testes da janela), o ffmpeg, o xdelta3 (patch de jogos) e o Chromium (modo navegador)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdelta3
          python -m playwright install --with-deps chromium
      # As duas janelas (moderna e clássica) rodam em processos separados: o Tk não aceita as duas juntas.
      - name: Testes sem janela (organizador, espelhos, TV, tradução, comandos de robô...)
        run: python -m pytest tests -q --ignore=tests/test_gui_moderna.py --ignore=tests/test_gui.py
      - name: Testes da janela moderna
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest tests/test_gui_moderna.py -q -rfE --durations=10 2>&1 | tee saida-janela.txt
      # Se o pytest fechar sem anotar o teste (ex.: o Tk caiu), o fim da saída vira um aviso no resumo da execução.
      - name: Mostrar o fim da saída da janela (só quando falha)
        if: failure()
        run: |
          echo "::error title=Fim da saída dos testes da janela::$(tail -n 40 saida-janela.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          echo "::error title=Threads quando falhou::$(grep -A40 'Threads quando falhou' saida-janela.txt | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          echo "::notice title=Testes mais lentos::$(grep -A12 'slowest' saida-janela.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - name: Testes da janela clássica
        run: xvfb-run -a python -m pytest tests/test_gui.py -q
